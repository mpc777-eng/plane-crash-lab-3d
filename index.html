function crashPlane(pl,pt,kind,n){if(pl.crashed)return;pl.crashed=true;const spd=pl.V.length();

 if(kind==='ground'){const vn=b.v.dot(n);if(vn<0)b.v.addScaledVector(n,-1.3*vn);b.v.multiplyScalar(0.55);fx('dust',pt,2);}

function damage(){if(!plane||!impactV)return 0;let t=0,b=0;for(const p of plane.parts){t+=p.m;if(p.off)b+=p.m;}return clamp(Math.round(b/t*80+Math.min(12,impactV/5)+(fireball?8:0)),1,100);}
function checkIntact(pl,dt){const p=pl.g.position,dir=pl.V.clone().normalize(),nose=p.clone().addScaledVector(dir,pl.L*0.5);
 if(other&&pl===plane&&!other.crashed&&!plane.crashed){const d=p.distanceTo(other.g.position);if(d<(pl.L+other.L)*0.35){const mid=p.clone().lerp(other.g.position,0.5);const v1=pl.V.clone(),v2=other.V.clone();
   crashPlane(pl,mid,'plane');crashPlane(other,mid,'plane');pl.body.v.copy(v1).multiplyScalar(0.3).addScaledVector(v2,0.2);other.body.v.copy(v2).multiplyScalar(0.3).addScaledVector(v1,0.2);return;}}
 for(const q of[nose,p]){if(isWater(q.x,q.z)&&q.y<0.2){crashPlane(pl,q.clone(),'water');return;}
  let hit=null;hitStatic(q,pl.R+0.2,(s,c)=>{hit=c.clone();return false;});if(hit){crashPlane(pl,hit,'block');return;}}
 const h=Hgt(p.x,p.z),hn=Hgt(nose.x,nose.z);if(p.y-pl.hr>h+1)pl.jumped=1;
 if(p.y-pl.hr<=h||nose.y<hn){const slope=clamp((Hgt(p.x,p.z)-Hgt(p.x,p.z-0.5))/0.5,0,0.25);
  if(selS==='ramp'&&!pl.jumped&&pl.V.y-slope*pl.V.z>-6&&nose.y>=hn-0.3&&state!=='fly'){p.y=h+pl.hr;pl.V.y=slope*pl.V.z;pl.rolling=1;return;}
  const n=normalAt(p.x,p.z);crashPlane(pl,new V3(nose.x,Math.max(hn,h),nose.z),'ground',n);}}

const _q=new THREE.Quaternion(),_ax=new V3();
function bodyStep(b,dt){if(b.sleep)return;const p=b.o.position,v=b.v;
 v.y-=(b.paper?3:9.8)*dt;if(b.paper)v.multiplyScalar(Math.exp(-1.2*dt));
 if(isWater(p.x,p.z)&&p.y<0){if(!b.wet){b.wet=true;if(v.length()>4&&b.kind!=='block')fx('splash',p,b.kind==='plane'?1.2:0.4);}
  v.multiplyScalar(Math.exp(-2.5*dt));b.w.multiplyScalar(Math.exp(-1.5*dt));
  if(b.floatT>0){b.floatT-=dt;v.y+=(9.8+clamp(-p.y,0,2)*5)*dt;}else{v.y+=8.6*dt;if(Math.random()<dt*3)fx('bubble',p,1);}}
 p.addScaledVector(v,dt);const wl=b.w.length();if(wl>0.001){_q.setFromAxisAngle(_ax.copy(b.w).divideScalar(wl),wl*dt);b.o.quaternion.premultiply(_q);}
 const h=Hgt(p.x,p.z),hr=b.kind==='block'?b.hy:b.hr*0.6;let ground=false;
 if(p.y-hr<h){p.y=h+hr;ground=true;const n=normalAt(p.x,p.z),vn=v.dot(n);if(vn<0){const imp=-vn;v.addScaledVector(n,-(1+(b.kind==='part'?0.35:0.2))*vn);
   if(imp>9&&!b.wet){fx(b.kind==='block'?'dust':'sparks',p.clone().setY(h),clamp(imp/20,0.3,1.2));if(b.kind==='plane')breakParts(b.pl,p,imp*1.2);}}
  const f=Math.exp(-(b.kind==='block'?6:3)*dt);v.x*=f;v.z*=f;b.w.multiplyScalar(f);}
 if(b.kind!=='block'||true){hitStatic(p,b.r*(b.kind==='plane'?0.8:0.7),(s,c,d)=>{_n.copy(p).sub(c);if(d<1e-4)_n.set(0,1,0);else _n.divideScalar(d);const vn=v.dot(_n);
  if(vn<-5){activate(s,v.clone().multiplyScalar(0.6).addScaledVector(_n,vn*0.3));v.multiplyScalar(0.6);if(b.kind!=='block')fx('sparks',c,0.5);if(b.kind==='plane')breakParts(b.pl,c,-vn);}
  else{p.addScaledVector(_n,b.r*0.7-d);if(vn<0)v.addScaledVector(_n,-1.2*vn);if(_n.y>0.5){ground=true;const f=Math.exp(-4*dt);v.x*=f;v.z*=f;b.w.multiplyScalar(f);}}});}
 if(ground&&v.lengthSq()<0.15&&b.w.lengthSq()<0.2){b.rest+=dt;if(b.rest>0.7)b.sleep=true;}else b.rest=0;
 if(p.y<-30)b.sleep=true;}
function step(dt){
 if(state==='flight'||state==='fly'||state==='crashed'){
  for(const pl of[plane,other]){if(!pl||pl.crashed)continue;pl.rolling=0;
   if(pl===plane&&state==='fly'){const k=held,turn=(k.L?1:0)-(k.R?1:0),pt=(k.U?1:0)-(k.D?1:0);fly.yaw+=turn*1.1*dt;fly.pitch=clamp(fly.pitch+pt*0.9*dt,-1.1,1.1);if(!pt)fly.pitch*=Math.exp(-0.4*dt);fly.roll=lerp(fly.roll,-turn*0.7,4*dt);
    const pp=pl.g.position;if(Math.hypot(pp.x,pp.z)>240){const want=Math.atan2(-pp.x,-pp.z);let d=want-fly.yaw;d=Math.atan2(Math.sin(d),Math.cos(d));fly.yaw+=clamp(d,-1,1)*dt;}
    pl.V.set(Math.sin(fly.yaw)*Math.cos(fly.pitch),Math.sin(fly.pitch),Math.cos(fly.yaw)*Math.cos(fly.pitch)).multiplyScalar(speed);}
   else if(pl===plane){const lift=selS==='ramp'?0:pl.type==='paper'?0.92:clamp(pl.V.length()/30,0.3,1)*0.95;pl.V.y-=9.8*(1-lift)*dt;}
   pl.g.position.addScaledVector(pl.V,dt);if(pl===other&&pl.g.position.z<-130)pl.g.position.z=130;
   orient(pl.g,pl.V,pl===plane&&state==='fly'?fly.roll:0);for(const pr of pl.props)pr.rotation.z+=dt*40;
   checkIntact(pl,dt);}
  for(let i=0;i<bodies.length;i++)bodyStep(bodies[i],dt);if(needCascade)cascade();
  if(state==='crashed'){crashT+=dt;smokeT-=dt;const pb=plane.body;if(pb&&damage()>35&&crashT<8&&smokeT<=0&&!(pb.wet&&pb.o.position.y<-0.5)){smokeT=0.12;fx('smoke',pb.o.position,1,1);}}
  if(recording){recT+=dt;if(frames.length===0||recT-frames[frames.length-1].t>=1/30){dyn.updateMatrixWorld(true);const a=new Float32Array(tracked.length*7),wp=new V3(),wq=new THREE.Quaternion();
    tracked.forEach((o,i)=>{o.getWorldPosition(wp);o.getWorldQuaternion(wq);a.set([wp.x,wp.y,wp.z,wq.x,wq.y,wq.z,wq.w],i*7);});frames.push({t:recT,a});}
   if(state==='crashed'&&crashT>9)recording=false;if(recT>40)recording=false;}}
 fxStep(dt);}
function startReplay(){if(frames.length<3)return;recording=false;frozen=true;state='replay';replayT=0;replayI=0;clearFx();for(const o of tracked)if(o.parent!==dyn)dyn.attach(o);snd.click();say('Instant replay!');}
function replayStep(dt){replayT+=dt;const F=frames,last=F[F.length-1];let t=Math.min(replayT,last.t);let i=0;while(i<F.length-2&&F[i+1].t<t)i++;const A=F[i],B=F[i+1],k=clamp((t-A.t)/(B.t-A.t),0,1);
 const qa=new THREE.Quaternion(),qb=new THREE.Quaternion();tracked.forEach((o,j)=>{const a=A.a,b=B.a,o7=j*7;o.position.set(lerp(a[o7],b[o7],k),lerp(a[o7+1],b[o7+1],k),lerp(a[o7+2],b[o7+2],k));qa.fromArray(a,o7+3);qb.fromArray(b,o7+3);o.quaternion.copy(qa.slerp(qb,k));});
 while(replayI<fxLog.length&&fxLog[replayI].t<=t){const e=fxLog[replayI++];fx(e.kind,e.p,e.s,1);}
 fxStep(dt);if(replayT>last.t+1.5){state='crashed';crashT=99;}}

function camUpdate(dt,rt){
 if(state==='title'){camA+=rt*0.15;cam.position.set(Math.sin(camA)*60,25,-30+Math.cos(camA)*60);cam.lookAt(0,5,-20);return;}
 if(state==='lab'||state==='count'){_cp.set(38,20,-100);_t.set(0,5,-30);if(selS==='mountain'||selS==='plane'){_cp.set(50,30,-95);_t.set(0,10,-10);}cam.position.lerp(_cp,Math.min(1,rt*3));camLook.lerp(_t,Math.min(1,rt*3));cam.lookAt(camLook);return;}
 if(state==='flight'||state==='fly'){const p=plane.g.position,d=plane.V.clone().normalize();_cp.copy(p).addScaledVector(d,-12-plane.L).add(new V3(state==='fly'?0:4,4+plane.L*0.3,0));cam.position.lerp(_cp,Math.min(1,rt*4));camLook.lerp(p,Math.min(1,rt*8));cam.lookAt(camLook);return;}
 const c=state==='replay'?impactPt:(plane.body?plane.body.o.position:impactPt);camA+=rt*(state==='replay'?0.5:0.25);const r=18+plane.L*1.2;
 _cp.set(c.x+Math.sin(camA)*r,Math.max(Hgt(c.x,c.z),0)+7+plane.L*0.4,c.z+Math.cos(camA)*r);cam.position.lerp(_cp,Math.min(1,rt*2));camLook.lerp(c,Math.min(1,rt*3));cam.lookAt(camLook);}

 if(state==='count'){cntT-=rt;const n=Math.ceil(cntT/0.8);if(n!==update.n){update.n=n;if(n>0)snd.beep(0);}if(cntT<=0){update.n=0;snd.beep(1);state='flight';startRec();}}
 if(state==='replay')replayStep(dt);

 const flying=(state==='flight'||state==='fly')&&!plane.crashed;setEngine(flying,plane?plane.V.length():0,plane&&plane.jet);
 camUpdate(dt,rt);}
